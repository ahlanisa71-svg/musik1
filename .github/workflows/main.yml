name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Susun folder proyek otomatis (untuk file hasil upload HP yang rata)
        run: |
          python3 - <<'PY'
          import os, re, shutil
          J = "app/src/main/java/com/glassplayer/app/"
          R = "app/src/main/res/"

          def put(src, dest_dir):
              os.makedirs(dest_dir, exist_ok=True)
              shutil.move(src, os.path.join(dest_dir, os.path.basename(src)))
              print("pindah", src, "->", dest_dir)

          for name in sorted(os.listdir(".")):
              if not os.path.isfile(name):
                  continue
              if name.endswith(".kt"):
                  txt = open(name, encoding="utf-8").read()
                  m = re.search(r"^package\s+([\w.]+)", txt, re.M)
                  if m and m.group(1).startswith("com.glassplayer.app"):
                      sub = m.group(1)[len("com.glassplayer.app"):].strip(".").replace(".", "/")
                      put(name, J + (sub + "/" if sub else ""))
              elif name == "AndroidManifest.xml":
                  put(name, "app/src/main/")
              elif name.endswith(".xml"):
                  head = open(name, encoding="utf-8").read()
                  head = re.sub(r"<\?xml.*?\?>|<!--.*?-->", "", head, flags=re.S)
                  tag = re.search(r"<([A-Za-z][\w.:-]*)", head)
                  t = tag.group(1) if tag else ""
                  if t == "resources":
                      put(name, R + "values/")
                  elif t == "adaptive-icon":
                      put(name, R + "mipmap-anydpi-v26/")
                  elif t == "appwidget-provider":
                      put(name, R + "xml/")
                  elif t in ("vector", "shape", "layer-list", "selector"):
                      put(name, R + "drawable/")
                  elif t in ("LinearLayout", "FrameLayout", "RelativeLayout", "ConstraintLayout"):
                      put(name, R + "layout/")
                  else:
                      print("dilewati (tidak dikenali):", name, t)
          PY

      - name: Tulis file Gradle (ada dua nama sama, jadi dibuat ulang di sini)
        run: |
          mkdir -p app
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.glassplayer.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.glassplayer.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.2"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += "-opt-in=androidx.media3.common.util.UnstableApi"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.09.03")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")

              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-session:1.4.1")
              implementation("com.google.guava:guava:32.1.3-android")
          }
          EOF

      - name: Cek struktur
        run: |
          find . -path ./.git -prune -o -type f -print | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Ringkasan error (jika gagal)
        if: failure()
        shell: bash
        run: |
          echo "===== DAFTAR ERROR KOMPILASI ====="
          grep -E "^e: |error:|FAILED|Execution failed|What went wrong" -A2 build.log | head -80 || true

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GlassPlayer.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassPlayer-apk
          path: GlassPlayer.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Musix build ${{ github.run_number }}
          files: GlassPlayer.apk
          make_latest: true
