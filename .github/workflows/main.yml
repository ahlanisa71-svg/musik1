name: Build Musix Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Scaffold Gradle Project & Map Source Files
        run: |
          python3 - << 'EOF'
          import os, re, shutil

          pkg = "com.glassplayer.app"
          pkg_path = pkg.replace(".", "/")

          os.makedirs(f"app/src/main/java/{pkg_path}", exist_ok=True)
          os.makedirs(f"app/src/main/java/{pkg_path}/data", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)
          os.makedirs("app/src/main/res/xml", exist_ok=True)
          os.makedirs("app/src/main/res/mipmap-anydpi-v26", exist_ok=True)
          os.makedirs("gradle/wrapper", exist_ok=True)

          for doc in ["LICENSE", "NOTICE_SQUARE.md"]:
              if os.path.exists(doc):
                  os.makedirs("app/src/main/assets", exist_ok=True)
                  shutil.copy(doc, f"app/src/main/assets/{doc}")

          has_song_decl = False
          for fname in os.listdir("."):
              if fname.endswith(".kt") and os.path.isfile(fname):
                  with open(fname, "r", encoding="utf-8") as f:
                      content = f.read()
                  if re.search(r'\b(data\s+class|class|interface|object)\s+Song\b', content):
                      has_song_decl = True
                  m = re.search(r'^\s*package\s+([\w\.]+)', content, re.MULTILINE)
                  target_pkg = m.group(1) if m else pkg
                  target_dir = f"app/src/main/java/{target_pkg.replace('.', '/')}"
                  os.makedirs(target_dir, exist_ok=True)
                  shutil.copy(fname, os.path.join(target_dir, fname))

          if not has_song_decl:
              song_file = f"app/src/main/java/{pkg_path}/data/Song.kt"
              song_code = (
                  "package com.glassplayer.app.data\n\n"
                  "data class Song(\n"
                  "    val id: String = \"\",\n"
                  "    val title: String = \"\",\n"
                  "    val artist: String = \"\",\n"
                  "    val album: String = \"\",\n"
                  "    val duration: Long = 0L,\n"
                  "    val streamUrl: String = \"\",\n"
                  "    val artworkUrl: String = \"\"\n"
                  ")\n"
              )
              with open(song_file, "w", encoding="utf-8") as f:
                  f.write(song_code)

          if os.path.exists("AndroidManifest.xml"):
              shutil.copy("AndroidManifest.xml", "app/src/main/AndroidManifest.xml")

          for res_file in os.listdir("."):
              if not os.path.isfile(res_file) or res_file == "AndroidManifest.xml":
                  continue
              if res_file.endswith(".xml"):
                  with open(res_file, "r", encoding="utf-8", errors="ignore") as f:
                      xml_content = f.read()

                  if "<resources" in xml_content:
                      shutil.copy(res_file, f"app/src/main/res/values/{res_file}")
                  elif "<appwidget-provider" in xml_content or "<network-security-config" in xml_content or "<paths" in xml_content or "<data-extraction-rules" in xml_content or "<full-backup-content" in xml_content:
                      shutil.copy(res_file, f"app/src/main/res/xml/{res_file}")
                  elif "<adaptive-icon" in xml_content:
                      shutil.copy(res_file, f"app/src/main/res/mipmap-anydpi-v26/{res_file}")
                  elif any(tag in xml_content for tag in [
                      "<LinearLayout", "<RelativeLayout", "<FrameLayout",
                      "<ConstraintLayout", "<CoordinatorLayout", "<ScrollView",
                      "<TextView", "<ImageView", "<Button", "<ImageButton",
                      "<RemoteViews", "<merge", "<androidx.", "<com."
                  ]):
                      shutil.copy(res_file, f"app/src/main/res/layout/{res_file}")
                  else:
                      shutil.copy(res_file, f"app/src/main/res/drawable/{res_file}")
              elif res_file.endswith((".png", ".jpg", ".jpeg", ".webp")):
                  shutil.copy(res_file, f"app/src/main/res/drawable/{res_file}")

          if not any(f.startswith("splash_bg.") for f in os.listdir("app/src/main/res/drawable")):
              with open("app/src/main/res/drawable/splash_bg.xml", "w") as f:
                  f.write('<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#121212"/></shape>')
          EOF

      - name: Generate Gradle Build Configuration
        run: |
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "Musix1"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.glassplayer.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.glassplayer.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0.0"
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs_nio:2.0.4")

              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")

              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              val media3Version = "1.4.1"
              implementation("androidx.media3:media3-exoplayer:$media3Version")
              implementation("androidx.media3:media3-session:$media3Version")
              implementation("androidx.media3:media3-ui:$media3Version")
              implementation("androidx.media3:media3-datasource-okhttp:$media3Version")

              implementation("com.github.TeamNewPipe:NewPipeExtractor:v0.24.2")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")

              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

      - name: Initialize Gradle Wrapper & Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musix1-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
