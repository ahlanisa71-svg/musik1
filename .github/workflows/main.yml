name: Build Musix Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Prepare Android Project & Gradle Files
        run: |
          python3 - << 'EOF'
          import os, re, shutil

          pkg = "com.glassplayer.app"
          pkg_path = pkg.replace(".", "/")

          os.makedirs(f"app/src/main/java/{pkg_path}", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)
          os.makedirs("app/src/main/res/xml", exist_ok=True)
          os.makedirs("app/src/main/res/mipmap-anydpi-v26", exist_ok=True)
          os.makedirs("gradle/wrapper", exist_ok=True)

          for doc in ["LICENSE", "NOTICE_SQUARE.md"]:
              if os.path.exists(doc):
                  os.makedirs("app/src/main/assets", exist_ok=True)
                  shutil.copy(doc, f"app/src/main/assets/{doc}")

          for fname in os.listdir("."):
              if fname.endswith(".kt") and os.path.isfile(fname):
                  with open(fname, "r", encoding="utf-8") as f:
                      content = f.read()
                  m = re.search(r'^\s*package\s+([\w\.]+)', content, re.MULTILINE)
                  target_pkg = m.group(1) if m else pkg
                  target_dir = f"app/src/main/java/{target_pkg.replace('.', '/')}"
                  os.makedirs(target_dir, exist_ok=True)
                  shutil.copy(fname, os.path.join(target_dir, fname))

          if os.path.exists("AndroidManifest.xml"):
              shutil.copy("AndroidManifest.xml", "app/src/main/AndroidManifest.xml")

          for res_file in os.listdir("."):
              if not os.path.isfile(res_file) or res_file == "AndroidManifest.xml":
                  continue
              if res_file.endswith(".xml"):
                  with open(res_file, "r", encoding="utf-8", errors="ignore") as f:
                      xml_content = f.read()

                  if "<resources" in xml_content:
                      shutil.copy(res_file, f"app/src/main/res/values/{res_file}")
                  elif any(tag in xml_content for tag in [
                      "<appwidget-provider", "<network-security-config",
                      "<paths", "<data-extraction-rules", "<full-backup-content"
                  ]):
                      shutil.copy(res_file, f"app/src/main/res/xml/{res_file}")
                  elif "<adaptive-icon" in xml_content:
                      shutil.copy(res_file, f"app/src/main/res/mipmap-anydpi-v26/{res_file}")
                  elif any(tag in xml_content for tag in [
                      "<LinearLayout", "<RelativeLayout", "<FrameLayout",
                      "<ConstraintLayout", "<CoordinatorLayout", "<ScrollView",
                      "<TextView", "<ImageView", "<Button", "<ImageButton",
                      "<RemoteViews", "<merge", "<androidx.", "<com."
                  ]):
                      shutil.copy(res_file, f"app/src/main/res/layout/{res_file}")
                  else:
                      shutil.copy(res_file, f"app/src/main/res/drawable/{res_file}")
              elif res_file.endswith((".png", ".jpg", ".jpeg", ".webp")):
                  shutil.copy(res_file, f"app/src/main/res/drawable/{res_file}")

          with open("settings.gradle.kts", "w", encoding="utf-8") as f:
              f.write('''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "Musix1"
          include(":app")
          ''')

          with open("gradle.properties", "w", encoding="utf-8") as f:
              f.write('''org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          ''')

          with open("build.gradle.kts", "w", encoding="utf-8") as f:
              f.write('''plugins {
              id("com.android.application") version "8.6.0" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          ''')

          app_gradle_body = '''plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.glassplayer.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.glassplayer.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 21
                  versionName = "1.9.12"
                  val repo = System.getenv("GITHUB_REPOSITORY") ?: "ahlanisa71-svg/Musik"
                  buildConfigField("String", "UPDATE_REPO", "\\"$repo\\"")
              }

              signingConfigs {
                  create("musix") {
                      storeFile = file("musix.keystore")
                      storePassword = "musix123"
                      keyAlias = "musix"
                      keyPassword = "musix123"
                  }
              }

              buildTypes {
                  debug {
                      signingConfig = signingConfigs.getByName("musix")
                  }
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("musix")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += "-opt-in=androidx.media3.common.util.UnstableApi"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.09.03")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")

              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-session:1.4.1")
              implementation("com.google.guava:guava:32.1.3-android")

              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.github.TeamNewPipe:NewPipeExtractor:v0.22.7")
          }
          '''

          with open("app/build.gradle.kts", "w", encoding="utf-8") as f:
              f.write(app_gradle_body.strip() + "\n")
          EOF

          if [ ! -f "app/musix.keystore" ] && [ ! -f "musix.keystore" ]; then
            keytool -genkeypair -v \
              -keystore app/musix.keystore \
              -storepass musix123 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias musix \
              -keypass musix123 \
              -dname "CN=Musix, OU=Dev, O=GlassPlayer, L=ID, S=ID, C=ID"
          elif [ -f "musix.keystore" ] && [ ! -f "app/musix.keystore" ]; then
            cp musix.keystore app/musix.keystore
          fi

      - name: Initialize Gradle Wrapper & Build Debug APK
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musix1-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
