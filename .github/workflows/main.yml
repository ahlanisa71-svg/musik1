name: Build Musix1 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Normalize project structure if files are at root
        run: |
          if [ ! -f "app/src/main/AndroidManifest.xml" ] && [ -f "AndroidManifest.xml" ]; then
            mkdir -p app/src/main/java/com/glassplayer/app/data \
                     app/src/main/java/com/glassplayer/app/download \
                     app/src/main/java/com/glassplayer/app/ui \
                     app/src/main/java/com/glassplayer/app/widget \
                     app/src/main/java/com/glassplayer/app/youtube \
                     app/src/main/res/drawable \
                     app/src/main/res/layout \
                     app/src/main/res/values \
                     app/src/main/res/xml

            [ -f "app.build.gradle.kts" ] && mv app.build.gradle.kts app/build.gradle.kts
            [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/AndroidManifest.xml
            [ -f "gradle.properties" ] && cp gradle.properties app/gradle.properties || true

            for f in *.kt; do
              [ -e "$f" ] || continue
              case "$f" in
                YouTubeApi.kt) mv "$f" app/src/main/java/com/glassplayer/app/data/ ;;
                YouTubeDownloader.kt) mv "$f" app/src/main/java/com/glassplayer/app/download/ ;;
                YouTubeStreamEngine.kt) mv "$f" app/src/main/java/com/glassplayer/app/youtube/ ;;
                Widgets.kt|WidgetUpdater.kt|DiscArt.kt) mv "$f" app/src/main/java/com/glassplayer/app/widget/ ;;
                Screens.kt|AddedScreens.kt|Components.kt|Dialogs.kt|Extras.kt|HomeNew.kt|LockScreen.kt|LyricsOverlay.kt|MoreScreens.kt|NowPlaying.kt|Pages.kt|PlayerArt.kt|Splash.kt|Theme.kt)
                  mv "$f" app/src/main/java/com/glassplayer/app/ui/ ;;
                *) mv "$f" app/src/main/java/com/glassplayer/app/ ;;
              esac
            done

            [ -f "file_paths.xml" ] && mv file_paths.xml app/src/main/res/xml/
            for f in widget_info_*.xml; do
              [ -e "$f" ] && mv "$f" app/src/main/res/xml/
            done

            for f in colors.xml strings.xml themes.xml; do
              [ -e "$f" ] && mv "$f" app/src/main/res/values/
            done

            for f in widget_capsule.xml widget_player_search.xml widget_recent.xml widget_recommend.xml; do
              [ -e "$f" ] && mv "$f" app/src/main/res/layout/
            done

            for f in ic_*.xml splash_bg.xml widget_*.xml; do
              [ -e "$f" ] && mv "$f" app/src/main/res/drawable/
            done
          fi

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi
          chmod +x gradlew

      - name: Build Debug APK
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "APK built at: $APK_PATH"
          cp "$APK_PATH" Musix1-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musix1-APK
          path: Musix1-debug.apk
