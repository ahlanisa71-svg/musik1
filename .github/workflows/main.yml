      - name: Tulis file Gradle (ada dua nama sama, jadi dibuat ulang di sini)
        run: |
          mkdir -p app
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.glassplayer.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.glassplayer.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 12
                  versionName = "1.9.3"
                  val repo = System.getenv("GITHUB_REPOSITORY") ?: "ahlanisa71-svg/Musik"
                  buildConfigField("String", "UPDATE_REPO", "\"$repo\"")
              }

              signingConfigs {
                  create("musix") {
                      storeFile = file("musix.keystore")
                      storePassword = "musix123"
                      keyAlias = "musix"
                      keyPassword = "musix123"
                  }
              }

              buildTypes {
                  debug {
                      signingConfig = signingConfigs.getByName("musix")
                  }
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("musix")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += "-opt-in=androidx.media3.common.util.UnstableApi"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.09.03")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")

              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-session:1.4.1")
              implementation("com.google.guava:guava:32.1.3-android")
          }
          EOF

      - name: Cek struktur
        run: |
          find . -path ./.git -prune -o -type f -print | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Ringkasan error (jika gagal)
        if: failure()
        shell: bash
        run: |
          echo "===== DAFTAR ERROR KOMPILASI ====="
          grep -E "^e: |error:|FAILED|Execution failed|What went wrong" -A2 build.log | head -80 || true

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GlassPlayer.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassPlayer-apk
          path: GlassPlayer.apk

      - name: Baca nomor versi
        id: ver
        run: |
          echo "code=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-c${{ steps.ver.outputs.code }}-b${{ github.run_number }}
          name: Musix ${{ steps.ver.outputs.name }} (build ${{ github.run_number }})
          files: GlassPlayer.apk
          make_latest: true
