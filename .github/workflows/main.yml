name: Build Musix APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"

          SDKMANAGER=""
          for bin in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager"
          do
            if [ -x "$bin" ]; then
              SDKMANAGER="$bin"
              break
            fi
          done

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          fi

      - name: Normalize project structure if files are at root
        run: |
          if [ ! -f "app/src/main/AndroidManifest.xml" ] && [ -f "AndroidManifest.xml" ]; then
            mkdir -p app/src/main/java/com/glassplayer/app/data \
                     app/src/main/java/com/glassplayer/app/download \
                     app/src/main/java/com/glassplayer/app/lyrics \
                     app/src/main/java/com/glassplayer/app/ui \
                     app/src/main/java/com/glassplayer/app/widget \
                     app/src/main/java/com/glassplayer/app/youtube \
                     app/src/main/res/drawable \
                     app/src/main/res/drawable-v26 \
                     app/src/main/res/layout \
                     app/src/main/res/values \
                     app/src/main/res/xml

            [ -f "app.build.gradle.kts" ] && mv app.build.gradle.kts app/build.gradle.kts
            [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/AndroidManifest.xml
            [ -f "gradle.properties" ] && cp gradle.properties app/gradle.properties || true

            for f in *.kt; do
              [ -e "$f" ] || continue
              case "$f" in
                YouTubeApi.kt) mv "$f" app/src/main/java/com/glassplayer/app/data/ ;;
                YouTubeDownloader.kt) mv "$f" app/src/main/java/com/glassplayer/app/download/ ;;
                YouTubeStreamEngine.kt) mv "$f" app/src/main/java/com/glassplayer/app/youtube/ ;;
                Widgets.kt|WidgetUpdater.kt|DiscArt.kt) mv "$f" app/src/main/java/com/glassplayer/app/widget/ ;;
                LyricsEngine.kt|LyricsOverlay.kt) mv "$f" app/src/main/java/com/glassplayer/app/lyrics/ ;;
                Screens.kt|AddedScreens.kt|Components.kt|Dialogs.kt|Extras.kt|HomeNew.kt|LockScreen.kt|MoreScreens.kt|NowPlaying.kt|Pages.kt|PlayerArt.kt|Splash.kt|Theme.kt)
                  mv "$f" app/src/main/java/com/glassplayer/app/ui/ ;;
                *) mv "$f" app/src/main/java/com/glassplayer/app/ ;;
              esac
            done

            [ -f "file_paths.xml" ] && mv file_paths.xml app/src/main/res/xml/
            for f in widget_info_*.xml; do
              [ -e "$f" ] && mv "$f" app/src/main/res/xml/
            done

            for f in colors.xml strings.xml themes.xml; do
              [ -e "$f" ] && mv "$f" app/src/main/res/values/
            done

            for f in widget_capsule.xml widget_disc_wide.xml widget_player_search.xml widget_recent.xml widget_recommend.xml; do
              [ -e "$f" ] && mv "$f" app/src/main/res/layout/
            done

            for f in ic_launcher.xml ic_launcher_round.xml; do
              [ -e "$f" ] && mv "$f" app/src/main/res/drawable-v26/
            done

            for f in ic_*.xml splash_bg.xml widget_bg.xml widget_capsule_bg.xml widget_cover_bg.xml widget_cover_circle.xml widget_glass_bg.xml widget_hole.xml widget_scrim.xml widget_search_bg.xml widget_vinyl.xml; do
              [ -e "$f" ] && mv "$f" app/src/main/res/drawable/
            done
          fi

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi
          chmod +x gradlew

      - name: Build Debug APK
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Debug APK was not produced." >&2
            exit 1
          fi
          echo "APK built at: $APK_PATH"
          cp "$APK_PATH" Musix-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musix-APK
          path: Musix-debug.apk

      - name: Publish APK Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Could not read the app version from app/build.gradle.kts." >&2
            exit 1
          fi

          TAG="v${VERSION_NAME}-c${VERSION_CODE}-b${GITHUB_RUN_NUMBER}"
          TITLE="Musix ${VERSION_NAME} (build ${GITHUB_RUN_NUMBER})"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" Musix-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" Musix-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "Pembaruan Musix ${VERSION_NAME}. Pasang APK ini untuk memperbarui aplikasi."
          fi
