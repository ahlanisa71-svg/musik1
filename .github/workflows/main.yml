      - name: Susun folder proyek otomatis (untuk file hasil upload HP yang rata)
        run: |
          python3 - <<'PY'
          import os, re, shutil
          J = "app/src/main/java/com/glassplayer/app/"
          R = "app/src/main/res/"

          def put(src, dest_dir):
              os.makedirs(dest_dir, exist_ok=True)
              shutil.move(src, os.path.join(dest_dir, os.path.basename(src)))
              print("pindah", src, "->", dest_dir)

          for name in sorted(os.listdir(".")):
              if not os.path.isfile(name):
                  continue
              if name.endswith(".kt"):
                  txt = open(name, encoding="utf-8").read()
                  m = re.search(r"^package\s+([\w.]+)", txt, re.M)
                  if m and m.group(1).startswith("com.glassplayer.app"):
                      sub = m.group(1)[len("com.glassplayer.app"):].strip(".").replace(".", "/")
                      put(name, J + (sub + "/" if sub else ""))
              elif name == "AndroidManifest.xml":
                  put(name, "app/src/main/")
              elif name.endswith(".xml"):
                  head = open(name, encoding="utf-8").read()
                  head = re.sub(r"<\?xml.*?\?>|<!--.*?-->", "", head, flags=re.S)
                  tag = re.search(r"<([A-Za-z][\w.:-]*)", head)
                  t = tag.group(1) if tag else ""
                  if t == "resources":
                      put(name, R + "values/")
                  elif t == "adaptive-icon":
                      put(name, R + "mipmap-anydpi-v26/")
                  elif t in ("appwidget-provider", "paths"):
                      put(name, R + "xml/")
                  elif t in ("vector", "shape", "layer-list", "selector"):
                      put(name, R + "drawable/")
                  elif t in ("LinearLayout", "FrameLayout", "RelativeLayout", "ConstraintLayout"):
                      put(name, R + "layout/")
                  else:
                      print("dilewati (tidak dikenali):", name, t)
          PY

